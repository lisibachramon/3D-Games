name: Proxy diagnose

# Manual diagnostics for the home-server reverse proxy (WebSocket upgrades are
# currently not reaching the game containers). Read-only: prints container
# list, the generated nginx config for the game vhosts, and the WS-upgrade
# directives. Same DEPLOY_* secrets as the deploy job.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Inspect reverse proxy config
    runs-on: ubuntu-22.04
    steps:
      - name: Diagnose over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -x
            docker ps --format "{{.Names}}  {{.Image}}  {{.Ports}}"
            PROXY=$(docker ps --format "{{.Names}} {{.Image}}" | grep -Ei "jwilder/nginx-proxy|nginxproxy/nginx-proxy" | grep -vi companion | head -1 | cut -d" " -f1)
            echo "proxy container: $PROXY"
            docker exec "$PROXY" nginx -v 2>&1 || true
            echo "--- http-level header/keepalive section (around the maps) ---"
            docker exec "$PROXY" sh -c "nginx -T 2>/dev/null | sed -n \"150,230p\"" || true
            echo "--- full pulsar 443 server block ---"
            docker exec "$PROXY" sh -c "nginx -T 2>/dev/null | awk \"/server_name pulsar/{f++} f==2{print} f==2&&/^}/{exit}\"" || true
            echo "--- vhost.d custom configs ---"
            docker exec "$PROXY" sh -c "ls -la /etc/nginx/vhost.d/ 2>/dev/null; for f in /etc/nginx/vhost.d/*; do echo \"== \$f\"; cat \"\$f\"; done 2>/dev/null | head -60" || true
            echo "--- WS handshake direct to pulsar container (expect 101) ---"
            PIP=$(docker inspect -f "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" 3d-games-pulsar-1 | awk "{print \$1}")
            curl -s -i -m 5 -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" -H "Sec-WebSocket-Version: 13" "http://$PIP:8080/" | head -3 || true
            echo "--- WS handshake via proxy from inside (expect 101) ---"
            curl -s -i -m 5 --http1.1 -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" -H "Sec-WebSocket-Version: 13" -H "Host: pulsar.lisibach.xyz" "http://127.0.0.1:80/" | head -3 || true
            echo "--- proxy_default network members ---"
            docker network inspect proxy_default --format "{{range .Containers}}{{.Name}} {{end}}" || true
          '
