name: bootstrap-workforce

# TEMPORARY one-shot workflow. Authorizes the dedicated deploy key of the new
# `workforce` repo (ai.lisibach.xyz) on the home server, using this repo's
# existing DEPLOY_* secrets. Removed again right after it has run once.
on: workflow_dispatch

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - name: Authorize workforce deploy key on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NEW_PUBKEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG7eCd2YxXlcpb8VvkzrLzQJwIAWeY+CB7hBujV3QMbD workforce-deploy@github-actions
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh; \
             grep -qF 'workforce-deploy@github-actions' ~/.ssh/authorized_keys 2>/dev/null \
               || printf '%s\n' '$NEW_PUBKEY' >> ~/.ssh/authorized_keys; \
             chmod 600 ~/.ssh/authorized_keys; \
             echo deploy-user:; whoami | base64; echo home:; pwd | base64"
          echo "✅ workforce deploy key authorized"
